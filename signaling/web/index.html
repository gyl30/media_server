<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Media Server 控制台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-text"><strong>Media Server</strong><span>流媒体管理控制台</span></span></a>
      <nav id="nav" class="nav" aria-label="页面"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button id="menu-button" class="icon-btn menu-button" type="button" aria-label="打开导航" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="/icons.svg#menu"></use></svg></button>
        <nav id="crumbs" class="crumbs" aria-label="位置"></nav>
        <div class="topbar-actions">
          <span id="updated" class="updated">尚未刷新</span>
          <button id="refresh-button" class="btn sm" type="button"><svg class="icon sm" aria-hidden="true"><use href="/icons.svg#refresh"></use></svg>刷新</button>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="device-dialog" class="dialog"></dialog>
  <dialog id="confirm-dialog" class="dialog sm" aria-labelledby="confirm-title">
    <div class="dialog-head"><h2 id="confirm-title">确认操作</h2></div>
    <div class="dialog-body"><p data-message></p><div class="notice warn" role="alert" data-error hidden><svg class="icon" aria-hidden="true"><use href="/icons.svg#alert"></use></svg><span></span></div></div>
    <div class="dialog-foot"><button class="btn" type="button" data-cancel>取消</button><button class="btn danger" type="button" data-confirm>确认</button></div>
  </dialog>
</body>
</html>
